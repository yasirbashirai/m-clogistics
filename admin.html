<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Admin — M&amp;C Logistics</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23E11D2A'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 7h9v8H3z'/%3E%3Cpath d='M12 9h4l3 3v3h-7z'/%3E%3Ccircle cx='6.5' cy='17' r='1.4'/%3E%3Ccircle cx='15.5' cy='17' r='1.4'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  body{ background:var(--bg-soft); }
  .adm-top{ background:var(--ink-grad); color:#fff; padding:14px 0; position:sticky; top:0; z-index:50; }
  .adm-top .container{ display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .adm-top .logo__main{ color:#fff; }
  .adm-shell{ display:grid; grid-template-columns:220px 1fr; gap:24px; max-width:1280px; margin:0 auto; padding:24px; }
  .adm-nav{ display:flex; flex-direction:column; gap:4px; position:sticky; top:80px; align-self:start; }
  .adm-nav button{ text-align:left; background:none; border:0; padding:11px 14px; border-radius:10px; font-weight:700;
    font-size:.92rem; color:var(--charcoal); display:flex; align-items:center; gap:10px; }
  .adm-nav button .badge{ margin-left:auto; background:var(--red); color:#fff; font-size:.7rem; padding:1px 7px; border-radius:999px; }
  .adm-nav button.active{ background:#fff; color:var(--red); box-shadow:var(--shadow-sm); }
  .adm-main{ min-width:0; }
  .adm-h{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .adm-h h1{ font-size:1.5rem; }
  .adm-login{ max-width:420px; margin:70px auto; }
  .adm-stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:8px; }
  .adm-stat{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; }
  .adm-stat b{ font-family:var(--display); font-size:1.7rem; display:block; line-height:1; }
  .adm-stat span{ font-size:.74rem; color:var(--slate); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .adm-stat.rev b{ color:var(--red); }
  .card2{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  .tbl{ width:100%; background:#fff; border:1px solid var(--line); border-radius:14px; border-collapse:separate; border-spacing:0; overflow:hidden; }
  .tbl th{ text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--slate); padding:12px; background:var(--bg-soft); border-bottom:1px solid var(--line); }
  .tbl td{ padding:12px; border-bottom:1px solid var(--line); font-size:.88rem; vertical-align:top; }
  .tbl tr:last-child td{ border-bottom:0; }
  .code{ font-family:monospace; font-weight:700; }
  .muted{ color:var(--slate); font-size:.8rem; }
  .tbl select, .mini-sel{ padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-weight:600; font-size:.8rem; }
  .pill-status{ font-size:.7rem; font-weight:800; padding:3px 9px; border-radius:999px; text-transform:capitalize; white-space:nowrap; }
  .s-pending_payment,.s-new{ background:#fff3cd; color:#7a5b00; } .s-paid,.s-delivered,.s-handled,.s-quoted{ background:#e6f9f0; color:#157a43; }
  .s-assigned,.s-picked_up{ background:#e7eefc; color:#2b4ea0; } .s-in_transit{ background:var(--red-soft); color:var(--red-dark); }
  .s-canceled,.s-closed{ background:#f1f1f1; color:#888; }
  .empty{ text-align:center; color:var(--slate); padding:50px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .price-tier{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .price-tier label{ width:90px; font-weight:700; font-size:.85rem; }
  .ok-toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-weight:600; box-shadow:var(--shadow-lg); display:none; z-index:99; }
  .linkbtn{ background:none;border:0;color:var(--red);font-weight:700;font-size:.8rem;cursor:pointer; }
  @media (max-width:880px){ .adm-shell{ grid-template-columns:1fr; } .adm-nav{ position:static; flex-direction:row; flex-wrap:wrap; } .adm-stats{ grid-template-columns:1fr 1fr; } .grid2,.grid3{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="adm-top">
  <div class="container">
    <span class="logo"><span class="logo__mark" style="width:34px;height:34px;flex:0 0 34px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10v9H3z"/><path d="M13 9h4.5l3.5 3.5V15h-8z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg></span><span class="logo__txt"><span class="logo__main" style="font-size:1.15rem">Dispatch Admin</span></span></span>
    <div style="display:flex;gap:10px;align-items:center">
      <a class="btn btn--ghost" href="index.html" target="_blank" style="border-color:rgba(255,255,255,.35);padding:8px 14px">View site ↗</a>
      <button class="btn btn--ghost" id="logoutBtn" style="display:none;border-color:rgba(255,255,255,.35);padding:8px 14px">Log out</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div class="adm-login" id="loginView">
  <div class="card2">
    <h2 class="section-title" style="font-size:1.4rem">Dispatch sign-in</h2>
    <p class="muted" style="margin-bottom:16px">Enter your admin token.</p>
    <div class="field"><label>Backend API base URL <span class="muted">(blank if same site)</span></label><input id="apiBase" type="text" placeholder="(same site) — or http://localhost:4242"></div>
    <div class="field"><label>Admin token</label><input id="adminToken" type="password" placeholder="ADMIN_TOKEN"></div>
    <button class="btn btn--primary btn--block" id="loginBtn">Sign in</button>
    <p class="muted" id="loginErr" style="color:var(--red);margin-top:12px;display:none"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="adm-shell" id="dashView" style="display:none">
  <nav class="adm-nav" id="nav">
    <button data-tab="overview" class="active">📊 Overview</button>
    <button data-tab="shipments">📦 Shipments</button>
    <button data-tab="quotes">📝 Quote Requests <span class="badge" id="bdgQuotes" style="display:none"></span></button>
    <button data-tab="submissions">✉️ Submissions <span class="badge" id="bdgSubs" style="display:none"></span></button>
    <button data-tab="pricing">💲 Services &amp; Pricing</button>
    <button data-tab="settings">⚙️ Settings</button>
  </nav>
  <main class="adm-main" id="main"></main>
</div>

<div class="ok-toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var LS="mcAdmin2";
  var cfg = JSON.parse(localStorage.getItem(LS) || "{}");
  var $=function(id){return document.getElementById(id);};
  var state={};

  // When this admin page is opened over the web, ALWAYS talk to the same site that
  // serves it (ignore any leftover "API URL"). This makes it impossible for a stale
  // URL to silently send saves to a wrong/dead backend. Only a local file:// copy
  // honors an explicit http(s) API URL.
  function api(p){
    var local = location.protocol === "file:";
    var base = local ? (cfg.apiBase||"").trim() : "";
    if (base && !/^https?:\/\//i.test(base)) base = "";
    return base.replace(/\/$/,"") + p;
  }
  function H(){ return { "x-admin-token":cfg.token, "Content-Type":"application/json" }; }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function money(n){ return n==null?"—":"$"+Number(n).toFixed(2); }
  function toast(m){ var t=$("toast"); t.textContent=m; t.style.display="block"; setTimeout(function(){t.style.display="none";},2200); }

  function showLogin(msg){ $("loginView").style.display=""; $("dashView").style.display="none"; $("logoutBtn").style.display="none";
    if(msg){ $("loginErr").style.display="block"; $("loginErr").textContent=msg; } }
  function showDash(){ $("loginView").style.display="none"; $("dashView").style.display=""; $("logoutBtn").style.display=""; }

  function get(p){ return fetch(api(p),{headers:H()}).then(function(r){ if(r.status===401) throw new Error("Invalid token."); if(!r.ok) throw new Error("Error "+r.status); return r.json(); }); }
  function send(method,p,body){ return fetch(api(p),{method:method,headers:H(),body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok || (j&&j.error)) throw new Error((j&&j.error)||("Save failed — HTTP "+r.status));
      return j;
    });
  }); }

  $("loginBtn").addEventListener("click",function(){
    cfg={ apiBase:$("apiBase").value.trim(), token:$("adminToken").value.trim() };
    if(!cfg.token){ showLogin("Enter your admin token."); return; }
    localStorage.setItem(LS,JSON.stringify(cfg));
    boot();
  });
  $("logoutBtn").addEventListener("click",function(){ localStorage.removeItem(LS); cfg={}; showLogin(); });
  $("nav").addEventListener("click",function(e){ var b=e.target.closest("button[data-tab]"); if(!b) return;
    $("nav").querySelectorAll("button").forEach(function(x){x.classList.toggle("active",x===b);}); openTab(b.getAttribute("data-tab")); });

  function boot(){
    get("/api/admin/overview").then(function(d){
      state.overview=d; showDash();
      if(d.counts.quotes){ $("bdgQuotes").style.display=""; $("bdgQuotes").textContent=d.counts.quotes; }
      if(d.counts.submissions){ $("bdgSubs").style.display=""; $("bdgSubs").textContent=d.counts.submissions; }
      var tab=(location.hash||"").slice(1), btn=$("nav").querySelector('[data-tab="'+tab+'"]');
      if(btn){ $("nav").querySelectorAll("button").forEach(function(x){x.classList.toggle("active",x===btn);}); openTab(tab); }
      else openTab("overview");
    }).catch(function(e){ showLogin(e.message+" — check URL/token. (Backend must be running.)"); });
  }

  function openTab(t){
    var m=$("main");
    if(t==="overview") return renderOverview(m);
    if(t==="shipments") return get("/api/admin/orders").then(function(d){ state.orders=d; renderShipments(m); });
    if(t==="quotes") return get("/api/admin/quotes").then(function(d){ state.quotes=d.quotes; renderQuotes(m); });
    if(t==="submissions") return get("/api/admin/submissions").then(function(d){ state.subs=d.submissions; renderSubs(m); });
    if(t==="pricing") return get("/api/admin/pricing").then(function(d){ state.pricing=d.pricing; renderPricing(m); });
    if(t==="settings") return get("/api/admin/settings").then(function(d){ state.settings=d.settings; renderSettings(m); });
  }

  /* ---------- OVERVIEW ---------- */
  function renderOverview(m){
    var c=state.overview.counts, rev=state.overview.revenue;
    m.innerHTML='<div class="adm-h"><h1>Overview</h1></div>'+
      '<div class="adm-stats">'+
      stat("Total orders",c.orders)+stat("Paid",c.paid)+stat("In transit",c.inTransit)+stat("Delivered",c.delivered)+stat("Revenue","$"+rev.toFixed(2),"rev")+
      '</div>'+
      '<div class="grid2" style="margin-top:16px">'+
        '<div class="card2"><b>📝 '+c.quotes+' new quote request(s)</b><p class="muted" style="margin-top:6px">Custom-quote submissions awaiting a price.</p><button class="btn btn--outline" data-go="quotes" style="margin-top:10px">Review quotes</button></div>'+
        '<div class="card2"><b>✉️ '+c.submissions+' new message(s)</b><p class="muted" style="margin-top:6px">Contact-form submissions from the website.</p><button class="btn btn--outline" data-go="submissions" style="margin-top:10px">View submissions</button></div>'+
      '</div>';
    m.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ $("nav").querySelector('[data-tab="'+b.dataset.go+'"]').click(); }); });
  }
  function stat(label,val,cls){ return '<div class="adm-stat '+(cls||"")+'"><b>'+val+'</b><span>'+label+'</span></div>'; }

  /* ---------- SHIPMENTS ---------- */
  function renderShipments(m){
    var st=state.orders.statuses, rows=state.orders.orders;
    m.innerHTML='<div class="adm-h"><h1>Shipments</h1><button class="btn btn--primary" id="addBtn">+ Add shipment</button></div>'+
      '<div id="addForm" style="display:none"></div>'+
      (rows.length? '<table class="tbl"><thead><tr><th>Code</th><th>Customer</th><th>Service</th><th>Route</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>'+
        rows.map(function(o){ var cu=o.customer||{};
          var route=o.serviceType==="Route Delivery"?((o.numberOfStops||(o.stops||[]).length)+" stops"):(esc(o.pickupAddress)+" → "+esc(o.deliveryAddress||"—"));
          return '<tr><td><span class="code">'+o.id+'</span><div class="muted">'+(o.createdAt||"").slice(0,10)+' · '+(o.source||"online")+'</div></td>'+
            '<td>'+esc(cu.name)+'<div class="muted">'+esc(cu.phone)+'<br>'+esc(cu.email)+'</div></td>'+
            '<td>'+esc(o.serviceType)+'<div class="muted">'+(o.weight||0)+' lb '+(o.date?"· "+o.date:"")+'</div></td>'+
            '<td class="muted">'+route+'</td>'+
            '<td><b>'+money(o.amountPaid||o.total)+'</b><div class="muted">'+(o.paid?"paid":"unpaid")+'</div></td>'+
            '<td><span class="pill-status s-'+o.status+'">'+(o.status||"").replace(/_/g," ")+'</span><br><select class="mini-sel" data-st="'+o.id+'" style="margin-top:6px">'+st.map(function(s){return '<option '+(s===o.status?"selected":"")+'>'+s+'</option>';}).join("")+'</select></td>'+
            '<td><button class="linkbtn" data-del="'+o.id+'">delete</button></td></tr>';
        }).join("")+'</tbody></table>'
        : '<div class="empty">No shipments yet. Click <b>+ Add shipment</b> or wait for online bookings.</div>');
    $("addBtn").addEventListener("click",toggleAddForm);
    m.querySelectorAll("[data-st]").forEach(function(s){ s.addEventListener("change",function(){ send("PATCH","/api/admin/orders/"+s.dataset.st,{status:s.value}).then(function(){ toast("Status updated"); }); }); });
    m.querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click",function(){ if(!confirm("Delete "+b.dataset.del+"?"))return; send("DELETE","/api/admin/orders/"+b.dataset.del).then(function(){ openTab("shipments"); }); }); });
  }
  function toggleAddForm(){
    var f=$("addForm"); if(f.style.display!=="none"){ f.style.display="none"; return; }
    f.style.display=""; f.innerHTML='<div class="card2"><h3 style="margin-bottom:12px">New shipment</h3>'+
      '<div class="grid3"><div class="field"><label>Service</label><select id="f_svc"><option>Single Delivery</option><option>Route Delivery</option></select></div>'+
      '<div class="field"><label>Customer name</label><input id="f_name"></div><div class="field"><label>Phone</label><input id="f_phone"></div></div>'+
      '<div class="grid2"><div class="field"><label>Email</label><input id="f_email"></div><div class="field"><label>Pickup address</label><input id="f_pickup"></div></div>'+
      '<div class="field" id="f_singleWrap"><label>Delivery address</label><input id="f_delivery"></div>'+
      '<div class="field" id="f_routeWrap" style="display:none"><label>Stops (one address per line)</label><textarea id="f_stops" style="min-height:80px"></textarea></div>'+
      '<div class="grid3"><div class="field"><label>Distance / farthest (mi)</label><input id="f_miles" type="number" value="10"></div>'+
      '<div class="field"><label>Weight (lb)</label><input id="f_weight" type="number" value="10"></div>'+
      '<div class="field"><label>Status</label><select id="f_status">'+state.orders.statuses.map(function(s){return '<option>'+s+'</option>';}).join("")+'</select></div></div>'+
      '<div class="grid3"><div class="field"><label>Date</label><input id="f_date" type="date"></div><div class="field"><label>Time</label><input id="f_time" type="time"></div>'+
      '<div class="field"><label>Mark paid?</label><select id="f_paid"><option value="false">No</option><option value="true">Yes</option></select></div></div>'+
      '<div class="field"><label>Instructions</label><input id="f_notes"></div>'+
      '<div class="chk-row"><label class="chk"><input type="checkbox" id="f_rush"> Rush</label><label class="chk"><input type="checkbox" id="f_weekend"> Weekend</label><label class="chk"><input type="checkbox" id="f_overnight"> Overnight</label></div>'+
      '<button class="btn btn--primary" id="f_save" style="margin-top:12px">Create shipment</button></div>';
    $("f_svc").addEventListener("change",function(){ var r=this.value==="Route Delivery"; $("f_routeWrap").style.display=r?"":"none"; $("f_singleWrap").style.display=r?"none":""; });
    $("f_save").addEventListener("click",function(){
      var svc=$("f_svc").value, stops=$("f_stops").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      var body={ serviceType:svc, name:$("f_name").value, phone:$("f_phone").value, email:$("f_email").value,
        pickupAddress:$("f_pickup").value, deliveryAddress:svc==="Single Delivery"?$("f_delivery").value:null,
        stops:svc==="Route Delivery"?stops:null, numberOfStops:svc==="Route Delivery"?stops.length:null,
        miles:Number($("f_miles").value)||0, weight:Number($("f_weight").value)||0, date:$("f_date").value, time:$("f_time").value,
        instructions:$("f_notes").value, paid:$("f_paid").value==="true", status:$("f_status").value,
        addons:{ rush:$("f_rush").checked, weekend:$("f_weekend").checked, overnight:$("f_overnight").checked } };
      if(!body.name||!body.pickupAddress){ toast("Name + pickup required"); return; }
      send("POST","/api/admin/orders",body).then(function(){ toast("Shipment created"); openTab("shipments"); });
    });
  }

  /* ---------- QUOTES ---------- */
  function renderQuotes(m){
    var rows=state.quotes;
    m.innerHTML='<div class="adm-h"><h1>Quote Requests</h1></div>'+
      (rows.length? '<table class="tbl"><thead><tr><th>Ref</th><th>Customer</th><th>Details</th><th>Status</th></tr></thead><tbody>'+
        rows.map(function(q){ var c=q.customer||{};
          return '<tr><td><span class="code">'+q.id+'</span><div class="muted">'+(q.createdAt||"").slice(0,10)+'</div></td>'+
          '<td>'+esc(c.name)+'<div class="muted">'+esc(c.phone)+'<br>'+esc(c.email)+'</div></td>'+
          '<td class="muted">'+esc(q.serviceType||"")+' · '+(q.weight||"?")+' lb<br>'+esc(q.pickupAddress||"")+' → '+esc(q.deliveryAddress||(q.stops||[]).join(", "))+(q.instructions?'<br><em>'+esc(q.instructions)+'</em>':"")+'</td>'+
          '<td><select class="mini-sel" data-q="'+q.id+'"><option '+(q.status==="new"?"selected":"")+'>new</option><option '+(q.status==="quoted"?"selected":"")+'>quoted</option><option '+(q.status==="closed"?"selected":"")+'>closed</option></select></td></tr>';
        }).join("")+'</tbody></table>' : '<div class="empty">No quote requests yet.</div>');
    m.querySelectorAll("[data-q]").forEach(function(s){ s.addEventListener("change",function(){ send("PATCH","/api/admin/quotes/"+s.dataset.q,{status:s.value}).then(function(){toast("Updated");}); }); });
  }

  /* ---------- SUBMISSIONS ---------- */
  function renderSubs(m){
    var rows=state.subs;
    m.innerHTML='<div class="adm-h"><h1>Form Submissions</h1></div>'+
      (rows.length? '<table class="tbl"><thead><tr><th>Ref</th><th>From</th><th>Message</th><th>Status</th></tr></thead><tbody>'+
        rows.map(function(s){ return '<tr><td><span class="code">'+s.id+'</span><div class="muted">'+(s.createdAt||"").slice(0,10)+'</div></td>'+
          '<td>'+esc(s.name)+'<div class="muted">'+esc(s.phone)+'<br>'+esc(s.email)+'</div></td>'+
          '<td class="muted">'+esc(s.message)+'</td>'+
          '<td><select class="mini-sel" data-s="'+s.id+'"><option '+(s.status==="new"?"selected":"")+'>new</option><option '+(s.status==="handled"?"selected":"")+'>handled</option><option '+(s.status==="closed"?"selected":"")+'>closed</option></select></td></tr>';
        }).join("")+'</tbody></table>' : '<div class="empty">No submissions yet. The Contact form posts here.</div>');
    m.querySelectorAll("[data-s]").forEach(function(sel){ sel.addEventListener("change",function(){ send("PATCH","/api/admin/submissions/"+sel.dataset.s,{status:sel.value}).then(function(){toast("Updated");}); }); });
  }

  /* ---------- PRICING ---------- */
  function renderPricing(m){
    var p=state.pricing;
    var bands=p.bands||[10,20,30,40,50,60];
    var wcHtml=(p.weightClasses||[]).map(function(wc,ci){
      var rows=bands.map(function(b,bi){
        var lo=bi===0?0:bands[bi-1]+1;
        return '<div class="price-tier"><label>'+lo+'–'+b+' mi</label><input type="number" step="0.01" data-wc="'+ci+'" data-band="'+bi+'" value="'+(wc.tiers[bi]!=null?wc.tiers[bi]:0)+'" style="max-width:140px"></div>';
      }).join("");
      return '<div class="card2"><h3>'+wc.label+' — distance tiers</h3><div style="margin-top:12px">'+rows+'</div></div>';
    }).join("");
    var veh=(p.vehicles||[]);
    var vehHtml=veh.map(function(v,i){
      var on=(v.available!==false);
      return '<div>'+fld(v.label+" — orders/day","p_cap_"+i,v.dailyCap)+
        '<label class="chk" style="margin-top:6px"><input type="checkbox" id="p_avail_'+i+'"'+(on?' checked':'')+'> Available on booking form</label></div>';
    }).join("");
    m.innerHTML='<div class="adm-h"><h1>Services &amp; Pricing</h1></div>'+
      wcHtml+
      '<div class="card2"><h3>Route Delivery</h3>'+
        '<p class="muted">Under the route threshold, every stop is the small-route rate. At/over it, the first stop is the base fee and each additional stop is the per-stop rate.</p>'+
        '<div class="grid2" style="margin-top:12px">'+
        fld("First stop / base fee ($)","p_base",p.route.base)+fld("Per stop, 9+ stops ($)","p_perstop",p.route.perStop)+'</div>'+
        '<div class="grid2" style="margin-top:12px">'+
        fld("Per stop, under threshold ($)","p_smallstop",p.route.smallStop!=null?p.route.smallStop:39.99)+fld("Route threshold (stops)","p_threshold",p.route.routeThreshold!=null?p.route.routeThreshold:9)+'</div></div>'+
      (function(){ var bt=p.boxTruck||{}; return '<div class="card2"><h3>Box truck &amp; out-of-area</h3><div class="grid3" style="margin-top:12px">'+
        fld("Box truck one-way ($)","p_bt_flat",bt.flatRate!=null?bt.flatRate:250)+fld("Box truck round trip ($)","p_bt_round",bt.roundTripRate!=null?bt.roundTripRate:500)+fld("Box truck max weight (lb)","p_bt_maxw",bt.maxWeight!=null?bt.maxWeight:300)+'</div>'+
        '<div class="grid2" style="margin-top:12px">'+fld("Box truck included miles","p_bt_miles",bt.includedMiles!=null?bt.includedMiles:60)+fld("Out-of-area base ($)","p_ooa",p.outsideTriCountyBase!=null?p.outsideTriCountyBase:150)+'</div></div>'; })()+
      '<div class="card2"><h3>Mileage &amp; limits</h3><div class="grid3" style="margin-top:12px">'+
        fld("Overage starts after (mi)","p_overstart",p.overageStartMiles)+fld("Per extra mile ($)","p_permile",p.overagePerMile)+fld("Max weight for instant (lb)","p_maxw",p.maxWeight)+'</div>'+
        '<div class="grid3" style="margin-top:12px">'+fld("Dispatch lead time (min)","p_lead",p.dispatchLeadMinutes||30)+fld("Foam wrap ($/item)","p_foam",p.foamWrapPerItem||5)+fld("Surcharge (% of booking cost)","p_surcharge",p.surchargePercent!=null?p.surchargePercent:6)+'</div></div>'+
      '<div class="card2"><h3>Add-on fees</h3><div class="grid3" style="margin-top:12px">'+
        fld("Helper ($)","p_helper",p.addons.helper)+fld("Furniture dolly ($)","p_furndolly",p.addons.furnitureDolly)+fld("Standard dolly ($)","p_stddolly",p.addons.standardDolly)+'</div>'+
        '<div class="grid3" style="margin-top:12px">'+fld("Rush ($)","p_rush",p.addons.rush)+fld("Weekend ($)","p_weekend",p.addons.weekend)+fld("Overnight ($)","p_overnight",p.addons.overnight)+'</div></div>'+
      '<div class="card2"><h3>Vehicles — availability &amp; daily caps</h3><p class="muted">Uncheck a vehicle to grey it out on the booking form so customers can\'t select it. Re-check when it\'s back in service.</p><div class="grid3" style="margin-top:12px">'+vehHtml+'</div></div>'+
      '<button class="btn btn--primary" id="savePricing">Save pricing</button>';
    $("savePricing").addEventListener("click",function(){
      var classes=(p.weightClasses||[]).map(function(wc,ci){
        var tiers=bands.map(function(b,bi){ var el=m.querySelector('[data-wc="'+ci+'"][data-band="'+bi+'"]'); return Number(el&&el.value)||0; });
        return { maxWeight:wc.maxWeight, label:wc.label, tiers:tiers };
      });
      var vehicles=veh.map(function(v,i){ var a=$("p_avail_"+i); return { id:v.id, label:v.label, surcharge:v.surcharge||0, dailyCap:num("p_cap_"+i), available:a?a.checked:(v.available!==false) }; });
      var bt0=p.boxTruck||{};
      var body={ bands:bands, weightClasses:classes,
        route:{ base:num("p_base"), perStop:num("p_perstop"), smallStop:num("p_smallstop"), routeThreshold:num("p_threshold")||9 },
        overageStartMiles:num("p_overstart"), overagePerMile:num("p_permile"), maxWeight:num("p_maxw"),
        dispatchLeadMinutes:num("p_lead"), foamWrapPerItem:num("p_foam"),
        surchargePercent:num("p_surcharge"),
        outsideTriCountyBase:num("p_ooa"),
        boxTruck:{ flatRate:num("p_bt_flat"), roundTripRate:num("p_bt_round"), maxWeight:num("p_bt_maxw"), includedMiles:num("p_bt_miles"),
          label:bt0.label||"Box truck — pickup & drop-off (≤300 lb, within 60 mi)", roundTripLabel:bt0.roundTripLabel||"Box truck — round trip (≤300 lb, within 60 mi)" },
        addons:{ helper:num("p_helper"), furnitureDolly:num("p_furndolly"), standardDolly:num("p_stddolly"), rush:num("p_rush"), weekend:num("p_weekend"), overnight:num("p_overnight") },
        vehicles:vehicles };
      send("PUT","/api/admin/pricing",body).then(function(d){ state.pricing=d.pricing; toast("Pricing saved — live on the site"); });
    });
  }

  /* ---------- SETTINGS ---------- */
  function renderSettings(m){
    var s=state.settings, pay=s.payments||{}, intg=s.integrations||{}, biz=s.business||{}, smtp=s.smtp||{}, sq=pay.square||{};
    m.innerHTML='<div class="adm-h"><h1>Settings</h1></div>'+
      '<div class="card2"><h3>💳 Payment gateway</h3>'+
        '<div class="grid2" style="margin-top:12px">'+
        '<div class="field"><label>Provider</label><select id="s_provider"><option value="square" '+(pay.provider!=="stripe"?"selected":"")+'>Square</option><option value="stripe" '+(pay.provider==="stripe"?"selected":"")+'>Stripe</option></select></div>'+
        '<div class="field"><label>Mode</label><select id="s_mode"><option value="test" '+(pay.mode==="test"?"selected":"")+'>Test</option><option value="live" '+(pay.mode==="live"?"selected":"")+'>Live</option></select></div>'+
        '</div>'+
        '<h4 style="margin-top:8px">Square</h4>'+
        '<div class="grid2">'+
          '<div class="field"><label>Application ID</label><input id="s_sq_app" value="'+esc(sq.applicationId||"")+'" placeholder="sq0idp-…"></div>'+
          '<div class="field"><label>Location ID</label><input id="s_sq_loc" value="'+esc(sq.locationId||"")+'" placeholder="L…"></div>'+
        '</div>'+
        '<div class="grid2">'+
          '<div class="field"><label>Access token '+(sq.accessTokenSet?'<span class="muted">— set ✓ (leave blank to keep)</span>':'')+'</label><input id="s_sq_token" type="password" placeholder="'+(sq.accessTokenSet?"•••••• stored":"EAAA…")+'"></div>'+
          '<div class="field"><label>Environment</label><select id="s_sq_env"><option value="production" '+(sq.env==="sandbox"?"":"selected")+'>Production</option><option value="sandbox" '+(sq.env==="sandbox"?"selected":"")+'>Sandbox</option></select></div>'+
        '</div>'+
        '<div class="field"><label>Webhook signature key '+(sq.webhookSignatureKeySet?'<span class="muted">— set ✓ (leave blank to keep)</span>':'')+'</label><input id="s_sq_sig" type="password" placeholder="'+(sq.webhookSignatureKeySet?"•••••• stored":"from Square → Webhooks")+'"></div>'+
        '<p class="muted">Square webhook endpoint: <span class="code">/api/square-webhook</span> — add in Square Developer Dashboard → Webhooks (event <span class="code">payment.updated</span>), then paste the generated Signature Key above.</p>'+
        '<details style="margin-top:10px"><summary class="muted">Stripe (legacy) settings</summary>'+
        '<div class="field"><label>Stripe publishable key (pk_…)</label><input id="s_pub" value="'+esc(pay.stripePublishableKey||"")+'" placeholder="pk_live_…"></div>'+
        '<div class="field"><label>Stripe secret key (sk_…) '+(pay.stripeSecretKeySet?'<span class="muted">— set ✓ (leave blank to keep)</span>':'')+'</label><input id="s_secret" type="password" placeholder="'+(pay.stripeSecretKeySet?"•••••• stored":"sk_live_…")+'"></div>'+
        (pay.envSecret?'<p class="muted">A secret key is also set via the host env var (recommended, takes priority).</p>':'')+
        '<p class="muted">Stripe webhook endpoint: <span class="code">/api/webhook</span> (event checkout.session.completed).</p>'+
        '</details>'+
      '</div>'+
      '<div class="card2"><h3>🔌 Integrations</h3><div class="grid2" style="margin-top:12px">'+
        '<div class="field"><label>Shipday API key</label><input id="s_shipday" type="password" placeholder="'+(intg.shipdaySet?"•••••• stored":"Basic …")+'"></div>'+
        '<div class="field"><label>Google Maps API key</label><input id="s_gmaps" type="password" placeholder="'+(intg.gmapsSet?"•••••• stored":"AIza…")+'"></div>'+
        '</div>'+
        '<div style="margin-top:10px;display:flex;align-items:center;gap:12px">'+
          '<button class="btn btn--outline" id="shipdayTest" type="button">Test Shipday connection</button>'+
          '<span id="shipdayStatus" class="muted">'+(intg.shipdaySet?"Key stored — click to verify it's accepted.":"No key set yet.")+'</span>'+
        '</div>'+
        '<h4 style="margin-top:16px">✉️ Email notifications (SMTP)</h4>'+
        '<p class="muted">New bookings and contact/careers submissions are emailed to the dispatch addresses below. For Gmail, use an <b>App Password</b> (not your normal password).</p>'+
        '<div class="grid3" style="margin-top:6px">'+
          fld("SMTP host","s_smtphost",smtp.host||"")+
          '<div class="field"><label>SMTP port</label><input id="s_smtpport" value="'+esc(smtp.port||"587")+'" placeholder="587"></div>'+
          '<div class="field"><label>Secure</label><select id="s_smtpsecure"><option value="false" '+(smtp.secure?"":"selected")+'>No — STARTTLS (587)</option><option value="true" '+(smtp.secure?"selected":"")+'>Yes — SSL (465)</option></select></div>'+
        '</div>'+
        '<div class="grid2" style="margin-top:6px">'+
          fld("SMTP user","s_smtpuser",smtp.user||"")+
          '<div class="field"><label>SMTP password '+(smtp.passSet?'<span class="muted">— set ✓ (leave blank to keep)</span>':'')+'</label><input id="s_smtppass" type="password" placeholder="'+(smtp.passSet?"•••••• stored":"App password")+'"></div>'+
        '</div>'+
        '<div class="field" style="margin-top:6px"><label>From address</label><input id="s_mailfrom" value="'+esc(smtp.from||"")+'" placeholder="M&amp;C Logistics &lt;dispatch@mclogistics.delivery&gt;"></div>'+
      '</div>'+
      '<div class="card2"><h3>🏢 Business info</h3><div class="grid2" style="margin-top:12px">'+
        fld("Business name","b_name",biz.name)+fld("Phone 1","b_p1",biz.phone1)+fld("Phone 2","b_p2",biz.phone2)+fld("Email","b_email",biz.email)+fld("Address","b_addr",biz.address)+fld("Hours","b_hours",biz.hours)+'</div>'+
        '<div class="field" style="margin-top:6px"><label>Dispatch notification emails (comma separated)</label><input id="b_dispatch" value="'+esc((s.dispatchEmails||[]).join(", "))+'"></div>'+
      '</div>'+
      '<div class="card2"><h3>🔐 Admin password</h3>'+
        '<p class="muted">'+((s.security&&s.security.adminPasswordSet)?"A dashboard password is set. ":"")+'Set or change the password you use to sign in here. Minimum 6 characters. (The host master token always keeps working as a backup.)</p>'+
        '<div class="grid2" style="margin-top:12px">'+
          '<div class="field"><label>New password</label><input id="s_newpass" type="password" placeholder="New admin password"></div>'+
          '<div class="field"><label>Confirm password</label><input id="s_newpass2" type="password" placeholder="Re-type new password"></div>'+
        '</div>'+
        '<button class="btn btn--outline" id="changePass" type="button" style="margin-top:6px">Change password</button>'+
      '</div>'+
      '<button class="btn btn--primary" id="saveSettings">Save settings</button>';
    // Shipday connection test
    $("shipdayTest").addEventListener("click",function(){
      var st=$("shipdayStatus"); st.textContent="Testing…"; st.style.color="";
      get("/api/admin/shipday-test").then(function(d){
        if(d.ok){ st.style.color="#0a7d2c"; st.textContent="✓ Connected — Shipday accepted the key ("+(d.source==="env"?"host env var":"dashboard")+")."; }
        else if(d.reason==="no_key"){ st.style.color="var(--red)"; st.textContent="No Shipday key set (env or dashboard)."; }
        else if(d.reason==="key_rejected"){ st.style.color="var(--red)"; st.textContent="✗ Key rejected by Shipday (HTTP "+d.status+"). Check the API key."; }
        else { st.style.color="var(--red)"; st.textContent="✗ Could not verify ("+(d.reason||"error")+(d.status?" "+d.status:"")+")."; }
      }).catch(function(e){ st.style.color="var(--red)"; st.textContent="✗ "+e.message; });
    });
    // Change admin password
    $("changePass").addEventListener("click",function(){
      var p1=val("s_newpass"), p2=val("s_newpass2");
      if(p1.length<6){ toast("Password must be at least 6 characters"); return; }
      if(p1!==p2){ toast("Passwords don't match"); return; }
      var b=$("changePass"); b.disabled=true; b.textContent="Saving…";
      send("PUT","/api/admin/password",{newPassword:p1}).then(function(){
        cfg.token=p1; localStorage.setItem(LS,JSON.stringify(cfg)); // keep this session signed in with the new password
        $("s_newpass").value=""; $("s_newpass2").value="";
        toast("✓ Admin password changed — it's active now");
      }).catch(function(e){ toast("⚠ "+e.message); }).then(function(){ b.disabled=false; b.textContent="Change password"; });
    });
    $("saveSettings").addEventListener("click",function(){
      var body={ payments:{ provider:$("s_provider").value, mode:$("s_mode").value, stripePublishableKey:$("s_pub").value },
        integrations:{}, business:{ name:val("b_name"),phone1:val("b_p1"),phone2:val("b_p2"),email:val("b_email"),address:val("b_addr"),hours:val("b_hours") },
        dispatchEmails:val("b_dispatch").split(",").map(function(x){return x.trim();}).filter(Boolean) };
      body.payments.square={ applicationId:val("s_sq_app"), locationId:val("s_sq_loc"), env:$("s_sq_env").value };
      if(val("s_sq_token")) body.payments.square.accessToken=val("s_sq_token");
      if(val("s_sq_sig")) body.payments.square.webhookSignatureKey=val("s_sq_sig");
      if(val("s_secret")) body.payments.stripeSecretKey=val("s_secret");
      if(val("s_shipday")) body.integrations.shipdayKey=val("s_shipday");
      if(val("s_gmaps")) body.integrations.gmapsKey=val("s_gmaps");
      // Email (SMTP) — save host/port/secure/user/from always; only set password when re-entered.
      body.smtp={ host:val("s_smtphost"), port:Number(val("s_smtpport"))||587,
        secure:val("s_smtpsecure")==="true", user:val("s_smtpuser"), from:val("s_mailfrom") };
      if(val("s_smtppass")) body.smtp.pass=val("s_smtppass");
      var sb=$("saveSettings"); sb.disabled=true; sb.textContent="Saving…";
      send("PUT","/api/admin/settings",body).then(function(d){
        state.settings=d.settings;
        var pk=(d.settings&&d.settings.payments&&d.settings.payments.stripePublishableKey)||"";
        var secSet=d.settings&&d.settings.payments&&d.settings.payments.stripeSecretKeySet;
        // Verify what actually persisted, so a silent non-save can never look like success again.
        if(body.payments.stripePublishableKey && !pk) toast("⚠ Saved, but the publishable key did NOT store. Try again.");
        else if(val("s_secret") && !secSet) toast("⚠ Saved, but the secret key did NOT store. Try again.");
        else toast("✓ Settings saved"+(pk?" — checkout key is live":""));
      }).catch(function(e){
        toast("⚠ NOT saved: "+e.message);
      }).then(function(){ sb.disabled=false; sb.textContent="Save settings"; });
    });
  }

  function fld(label,id,v){ return '<div class="field"><label>'+label+'</label><input id="'+id+'" value="'+esc(v==null?"":v)+'"></div>'; }
  function num(id){ return Number($(id).value)||0; }
  function val(id){ var e=$(id); return e?e.value.trim():""; }

  // init
  if(cfg.token){ $("apiBase").value=cfg.apiBase||""; boot(); } else { showLogin(); }
})();
</script>
</body>
</html>
